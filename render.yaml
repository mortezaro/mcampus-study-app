services:
  - type: web
    name: mcampus-study-app
    runtime: node
    region: frankfurt
    branch: main
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: mcampus-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /data
      - key: MAX_UPLOAD_MB
        value: 25
      - key: ADMIN_TOKEN
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: PROLIFIC_COMPLETION_URL
        sync: false
